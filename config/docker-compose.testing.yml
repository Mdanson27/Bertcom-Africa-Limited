# Bertcom Africa Business OS — local production-like testing
#
# Purpose:
#   GitHub Pages -> Cloudflare Quick Tunnel -> localhost:8000
#   API + SAQ worker -> Neon
#   API + SAQ worker -> local Valkey
#
# Secrets belong in ../.env.testing and MUST NOT be committed.

name: bertcom-local-testing

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: bertcom-testing-valkey
    restart: unless-stopped
    volumes:
      - bertcom_testing_valkey:/data
    networks:
      bertcom_testing:
        ipv4_address: 172.28.250.10
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: bertcom-api:testing
    container_name: bertcom-testing-api
    restart: unless-stopped
    command: ["sh", "/app/scripts/start_api.sh"]
    env_file:
      - ../.env.testing
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_BASE_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: https://mdanson27.github.io
      BERTCOM_ADMIN_EMAILS: ddaannson@gmail.com,automindsafrica@gmail.com
      VALKEY_URL: redis://172.28.250.10:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - bertcom_testing
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: bertcom-api:testing
    container_name: bertcom-testing-worker
    restart: unless-stopped
    command: ["sh", "/app/scripts/start_worker.sh"]
    env_file:
      - ../.env.testing
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_BASE_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: https://mdanson27.github.io
      BERTCOM_ADMIN_EMAILS: ddaannson@gmail.com,automindsafrica@gmail.com
      VALKEY_URL: redis://172.28.250.10:6379/0
    networks:
      - bertcom_testing
    depends_on:
      api:
        condition: service_healthy

volumes:
  bertcom_testing_valkey:


networks:
  bertcom_testing:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.250.0/24
